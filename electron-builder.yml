# Builds the zapped desktop app. Run through `npm run desktop:dist` or the
# release workflow (.github/workflows/release.yml).
appId: com.euzapus.zapped
productName: zapped
copyright: Copyright © 2026 euZAPUS. All rights reserved.

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - desktop/dist/**
  - build/icon.png
  - package.json
  - LICENSE

# The updater reads this feed: every GitHub Release created by the workflow.
publish:
  - provider: github
    owner: euZAPUS
    repo: zapped
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: zapped-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: zapped
  # Uninstalling or updating never touches the user's data (history, settings).
  deleteAppDataOnUninstall: false

linux:
  executableName: zapped
  target: [AppImage]
  category: Utility
  artifactName: zapped-${version}.${ext}

mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  identity: null # unsigned: macOS cannot auto-update unsigned apps, see README
  artifactName: zapped-${version}-${arch}.${ext}
